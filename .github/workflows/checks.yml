name: checks

on:
  push:
    branches: [master]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install numpy pandas pytest
      - name: Byte-compile backend, Streamlit and research code
        run: python -m compileall -q src/backend src/streamlit kaggle
      - name: Validate Kaggle notebooks against their source
        run: python kaggle/scripts/validate_package.py
      - name: Unit tests
        run: pytest kaggle/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build Spring Boot app
        working-directory: src/frontend
        run: chmod +x mvnw && ./mvnw -q -B -DskipTests package
